[package]
name = "bookscan-companion"
version = "0.1.0"
edition = "2021"
description = "bookscan companion — LAN receive + CPU pipeline + Livescan UI"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "net"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = true, features = ["jpeg", "png"] }
imageproc = "0.25"
ndarray = "0.16"
printpdf = "0.7"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
local-ip-address = "0.6"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
bytes = "1"
base64 = "0.22"
rfd = "0.15"
opener = "0.7"
filetime = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
